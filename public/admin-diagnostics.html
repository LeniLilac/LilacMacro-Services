<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csrf-token" content="__CSRF_TOKEN__" />
    <title>Diagnostics · LilacMacro Control Desk</title>
    <link rel="stylesheet" href="/assets/site.css" />
  </head>
  <body class="admin-body">
    <header class="masthead admin-masthead">
      <a class="brand" href="/"><span class="brand-mark">L</span>LilacMacro</a
      ><strong>CONTROL DESK</strong>
      <nav class="admin-nav" aria-label="Control desk">
        <a href="/admin">Overview</a><a href="/admin/codes">Codes</a
        ><a href="/admin/schedules">Schedules</a><a href="/admin/features">Features</a
        ><a aria-current="page" href="/admin/diagnostics">Diagnostics</a
        ><a href="/admin/telemetry">Telemetry</a><a href="/admin/audit">Audit</a
        ><a href="/admin/api-keys">API keys</a>
      </nav>
      <button class="button small" id="logout">Sign out</button>
    </header>
    <main class="admin-shell">
      <section class="admin-heading">
        <div>
          <div class="eyebrow">PRIVATE SUPPORT DATA</div>
          <h1>Diagnostics</h1>
          <p>Review time-limited archives and issue exact-size grants only when needed.</p>
        </div>
        <button class="button small" id="refresh-diagnostics" type="button">Refresh</button>
      </section>
      <div id="notice" class="notice" role="status" hidden></div>
      <section class="admin-grid single-purpose">
        <article class="panel panel-wide">
          <form id="large-upload-form" class="large-upload-form" autocomplete="off">
            <label
              ><span>Installation ID</span
              ><input
                name="installId"
                maxlength="36"
                placeholder="00000000-0000-0000-0000-000000000000"
                required /></label
            ><label
              ><span>Exact archive size (bytes)</span
              ><input
                name="sizeBytes"
                type="number"
                min="3221225473"
                max="32212254720"
                required /></label
            ><label
              ><span>Archive kind</span
              ><select name="kind">
                <option value="deep-debug">Deep debug</option>
                <option value="live-debug">Live debug</option>
                <option value="runtime-log">Runtime log</option>
                <option value="installer-log">Installer log</option>
              </select></label
            ><button class="button primary" type="submit">Issue 30-minute grant</button>
          </form>
          <div id="large-upload-result" class="grant-result" hidden>
            <div><strong>Large-file grant</strong><span id="large-upload-expiry"></span></div>
            <textarea
              id="large-upload-grant"
              rows="3"
              readonly
              aria-label="Large-file grant"
            ></textarea
            ><button class="button small" id="copy-large-upload-grant" type="button">
              Copy grant
            </button>
          </div>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Archive</th>
                  <th>Size</th>
                  <th>Status</th>
                  <th>Uploaded</th>
                  <th>Expires</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="diagnostic-rows"></tbody>
            </table>
          </div>
        </article>
      </section>
    </main>
    <dialog id="confirm-dialog">
      <form method="dialog" class="confirm-card">
        <h2>Confirm action</h2>
        <p id="confirm-message"></p>
        <div class="dialog-actions">
          <button class="button" value="cancel">Cancel</button
          ><button class="button warning" value="confirm">Confirm</button>
        </div>
      </form>
    </dialog>
    <script src="/assets/admin.js" defer></script>
  </body>
</html>
