<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csrf-token" content="__CSRF_TOKEN__" />
    <title>Features · LilacMacro Control Desk</title>
    <link rel="stylesheet" href="/assets/site.css" />
  </head>
  <body class="admin-body">
    <header class="masthead admin-masthead">
      <a class="brand" href="/"><span class="brand-mark">L</span>LilacMacro</a
      ><strong>CONTROL DESK</strong>
      <nav class="admin-nav" aria-label="Control desk">
        <a href="/admin">Overview</a><a href="/admin/codes">Codes</a
        ><a href="/admin/schedules">Schedules</a
        ><a aria-current="page" href="/admin/features">Features</a
        ><a href="/admin/diagnostics">Diagnostics</a><a href="/admin/telemetry">Telemetry</a
        ><a href="/admin/audit">Audit</a><a href="/admin/api-keys">API keys</a>
      </nav>
      <button class="button small" id="logout">Sign out</button>
    </header>
    <main class="admin-shell">
      <section class="admin-heading">
        <div>
          <div class="eyebrow">RUNTIME SAFETY</div>
          <h1>Feature safety</h1>
          <p>Remote state may only narrow local behavior.</p>
        </div>
        <div class="revision">REVISION <strong id="revision">—</strong></div>
      </section>
      <div id="notice" class="notice" role="status" hidden></div>
      <section class="admin-grid single-purpose">
        <article class="panel panel-wide">
          <form id="feature-form" class="feature-form">
            <label
              ><span>Feature</span
              ><select name="feature"></select></label
            ><label
              ><span>Reason</span
              ><input
                name="reason"
                maxlength="240"
                placeholder="Why this feature is disabled"
                required /></label
            ><label
              ><span>Expires at (optional UTC)</span
              ><input name="expiresAt" type="datetime-local" /></label
            ><button class="button warning" type="submit">Disable</button>
          </form>
          <div id="disablements" class="item-list"></div>
        </article>
      </section>
    </main>
    <dialog id="confirm-dialog">
      <form method="dialog" class="confirm-card">
        <h2>Confirm action</h2>
        <p id="confirm-message"></p>
        <div class="dialog-actions">
          <button class="button" value="cancel">Cancel</button
          ><button class="button warning" value="confirm">Confirm</button>
        </div>
      </form>
    </dialog>
    <script src="/assets/admin.js" defer></script>
  </body>
</html>
