<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csrf-token" content="__CSRF_TOKEN__" />
    <title>Schedules · LilacMacro Control Desk</title>
    <link rel="stylesheet" href="/assets/site.css?v=2" />
  </head>
  <body class="admin-body">
    <header class="masthead admin-masthead">
      <a class="brand" href="/"><span class="brand-mark">L</span>LilacMacro</a
      ><strong>CONTROL DESK</strong>
      <nav class="admin-nav" aria-label="Control desk">
        <a href="/admin">Overview</a><a href="/admin/codes">Codes</a
        ><a aria-current="page" href="/admin/schedules">Schedules</a
        ><a href="/admin/features">Features</a><a href="/admin/diagnostics">Diagnostics</a
        ><a href="/admin/telemetry">Telemetry</a><a href="/admin/audit">Audit</a
        ><a href="/admin/api-keys">API keys</a>
      </nav>
      <button class="button small" id="logout">Sign out</button>
    </header>
    <main class="admin-shell">
      <section class="admin-heading">
        <div>
          <div class="eyebrow">UTC CYCLE ANCHORS</div>
          <h1>Schedules</h1>
          <p>Each next occurrence is also that shop’s repeating cycle anchor.</p>
        </div>
        <div class="revision">REVISION <strong id="revision">—</strong></div>
      </section>
      <div id="notice" class="notice" role="status" hidden></div>
      <section class="admin-grid single-purpose">
        <article class="panel panel-wide">
          <form id="schedule-form" class="schedule-form">
            <label
              ><span>Schedule</span
              ><select name="key">
                <option value="gold-shop-reset">Gold shop reset</option>
                <option value="raid-shop-reset">Raid shop reset</option>
                <option value="expedition-shop-reset">Expedition shop reset</option>
              </select></label
            ><label
              ><span>Next occurrence</span
              ><input name="nextAt" type="datetime-local" required /></label
            ><label
              ><span>Cadence seconds</span
              ><input name="cadenceSeconds" type="number" min="1" max="31622400" required /></label
            ><button class="button primary" type="submit">Set schedule</button>
          </form>
          <div id="schedules-list" class="item-list"></div>
        </article>
      </section>
    </main>
    <script src="/assets/admin.js?v=2" defer></script>
  </body>
</html>
