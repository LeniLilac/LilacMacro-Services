<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csrf-token" content="__CSRF_TOKEN__" />
    <title>Audit · LilacMacro Control Desk</title>
    <link rel="stylesheet" href="/admin/assets/site.css" />
  </head>
  <body class="admin-body">
    <header class="masthead admin-masthead">
      <a class="brand" href="/"><span class="brand-mark">L</span>LilacMacro</a
      ><strong>CONTROL DESK</strong>
      <nav class="admin-nav" aria-label="Control desk">
        <a href="/admin">Overview</a><a href="/admin/codes">Codes</a
        ><a href="/admin/schedules">Schedules</a><a href="/admin/features">Features</a
        ><a href="/admin/diagnostics">Diagnostics</a><a href="/admin/telemetry">Telemetry</a
        ><a aria-current="page" href="/admin/audit">Audit</a><a href="/admin/api-keys">API keys</a>
      </nav>
      <button class="button small" id="logout">Sign out</button>
    </header>
    <main class="admin-shell">
      <section class="admin-heading">
        <div>
          <div class="eyebrow">ACCOUNTABILITY</div>
          <h1>Immutable audit</h1>
          <p>Control, diagnostic, and API-key administration in one timeline.</p>
        </div>
        <button class="button small" id="refresh-audit" type="button">Refresh</button>
      </section>
      <div id="notice" class="notice" role="status" hidden></div>
      <section class="admin-grid single-purpose">
        <article class="panel panel-wide">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Time</th>
                  <th>Actor</th>
                  <th>Action</th>
                  <th>Target / revision</th>
                </tr>
              </thead>
              <tbody id="audit-rows"></tbody>
            </table>
          </div>
        </article>
      </section>
    </main>
    <script src="/admin/assets/admin.js" defer></script>
  </body>
</html>
